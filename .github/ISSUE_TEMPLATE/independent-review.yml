name: Independent review / مراجعة تجربة
description: Report one reproducible observation using public or invented data.
title: "[Review] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for trying the tool. Please use public or invented input only.
        لا ترفق ملفات العمل أو أسماء أو بيانات شخصية. This form is public.
        Tasks: https://github.com/cometeux/arabic-ai-quality-lab/blob/main/docs/REVIEW_PROTOCOL.md
  - type: dropdown
    id: tool
    attributes:
      label: Tool / الأداة
      options:
        - Arabic Retrieval Lab
        - Action Review
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Date, page/build, browser and device
      description: Include the URL, selected search mode and version shown, if available.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task and exact public input / المهمة والنص التجريبي
      description: Include steps someone else can repeat; use invented or public text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect before any explanation?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened, and why did it matter?
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Task outcome / النتيجة
      options:
        - Completed without assistance
        - Completed with assistance
        - Could not complete
        - Observation only
    validations:
      required: true
  - type: textarea
    id: help
    attributes:
      label: Assistance, hesitation or misleading interpretation
      description: Describe help received and what the score, flag or export meant to you.
  - type: dropdown
    id: relationship
    attributes:
      label: Review context
      options:
        - External reviewer
        - Project maintainer or contributor
        - Automated or AI-assisted check
    validations:
      required: true
