name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run evaluate
      - run: npm run evaluate:challenge
      - run: git diff --exit-code -- evaluation.json evaluation-challenge.json
